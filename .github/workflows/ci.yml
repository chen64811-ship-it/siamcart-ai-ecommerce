name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      STORE_DB_PATH: /tmp/siamcart-ci.db
      DATABASE_URL: sqlite:////tmp/siamcart-ci.db
      DEEPSEEK_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app run.py
      - name: Migration smoke test
        run: python -m alembic upgrade head && python run.py init
      - name: Python tests
        run: python -m pytest -q
      - name: JavaScript syntax check
        run: find app/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Docker build
        run: docker build -t siamcart-ci .
