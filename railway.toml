# Railway deployment configuration
# See https://docs.railway.com/reference/config-as-code

[deploy]
# Health check: the app exposes GET /health returning 200.
healthcheck_path = "/health"
healthcheck_timeout_seconds = 300
# Restart the container on failure so a crash recovers automatically.
restart_policy_type = "ON_FAILURE"
restart_policy_max_retries = 5

# ── PostgreSQL production ───────────────────────────────────────────────
# Attach a Railway Postgres service and reference its DATABASE_URL variable
# (Railway injects it as postgresql://... or postgres://...). Alembic runs
# before the web process starts, and app/db/connection.py normalizes the
# legacy postgres:// scheme to postgresql:// automatically.
#
# ── Persistent volume (configured on the Railway service, not here) ─────
# Mount a volume at /data. It holds:
#   - STORE_DB_PATH=/data/orders.db   (SQLite fallback when DATABASE_URL is unset)
#   - CHROMA_DIR=/data/chroma         (persistent ChromaDB policy index)
# Both are set in the Dockerfile so the policy index and demo data survive
# restarts and deploys.
